name: Release

# Pushing a version tag (v1.2.3) releases it:
#   build    tests, rebuilds dist/ and checks it matches the files committed at the tag
#   attest   signs a build provenance attestation for the built files
#   release  creates the GitHub release with the files attached, then moves the major tag (v1)
# Each job gets only the permissions it needs. Only the attest job can mint an OIDC token,
# and it runs no code from the repository or its dependencies.
#
# The major tag is a plain git tag, never a GitHub release, so it stays movable when the
# repository's immutable releases setting is on.
#
# The release job can be re-run: it publishes a release only if it doesn't exist yet.
#
# After a release, point the first example in README.md at the new release's commit:
#   git ls-remote https://github.com/DefectDojo/defectdojo-action refs/tags/v1.2.3 'refs/tags/v1.2.3^{}' | tail -n 1

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: dist/ matches the source
        run: npm run build && git diff --exit-code dist/
      - name: Tag matches package.json
        run: '[ "v$(node -p "require(\"./package.json\").version")" = "$GITHUB_REF_NAME" ]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/index.mjs
            dist/licenses.txt
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign the attestation with a Sigstore certificate
      attestations: write # store the attestation in the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/index.mjs
            release-assets/licenses.txt

  release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and move the major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Assets match the files at the tag
        run: |
          for file in index.mjs licenses.txt; do
            cmp "release-assets/$file" "dist/$file"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          assets=(release-assets/index.mjs release-assets/licenses.txt)
          if ! draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1); then
            [[ "$draft" == *"release not found"* ]] || { echo "$draft" >&2; exit 1; }
            prerelease=()
            [[ "$tag" == *-* ]] && prerelease=(--prerelease)
            # With assets, gh creates a draft, uploads them, then publishes, so an immutable
            # release is never published without its assets.
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes --verify-tag "${prerelease[@]}"
          elif [ "$draft" = true ]; then
            echo "A draft of $tag exists from an earlier run. Replacing its assets and publishing it."
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false
          else
            # Published by an earlier run. Its assets can't be replaced (or changed at all once
            # the release is immutable): upload missing ones and check the others match.
            attached=$(gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.digest)"')
            for file in "${assets[@]}"; do
              name=${file##*/}
              digest=$(awk -v name="$name" '$1 == name { print $2 }' <<< "$attached")
              if [ -z "$digest" ]; then
                gh release upload "$tag" "$file"
              elif [ "$digest" = "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]; then
                echo "$name is already attached to $tag."
              elif [ "$digest" = null ]; then
                echo "::warning::$name is attached to $tag but GitHub reports no digest for it. Left as it is."
              else
                echo "::error::$name attached to $tag differs from this build ($digest)."
                exit 1
              fi
            done
          fi
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prereleases and patches to older lines leave the major tag where it is.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "Prerelease, not moving the major tag."; exit 0; fi
          major="${GITHUB_REF_NAME%%.*}"
          highest=$(git tag --list "$major.*.*" | grep -v -- - | sort -V | tail -1)
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then echo "$highest is newer, not moving $major."; exit 0; fi
          git tag -f "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$major"
