name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and move the major tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ matches the source
        run: npm run build && git diff --exit-code dist/
      - name: Tag matches package.json
        run: '[ "v$(node -p "require(\"./package.json\").version")" = "$GITHUB_REF_NAME" ]'
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f origin "refs/tags/$major"
