# A minimal Community Edition stack for the end-to-end test. Not for production.
x-django: &django
  image: "docker.io/defectdojo/defectdojo-django:${DJANGO_VERSION:-3.4.202}"
  environment: &django-env
    DD_DEBUG: "False"
    DD_ALLOWED_HOSTS: "*"
    DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
    DD_CELERY_BROKER_URL: redis://valkey:6379/0
    DD_CACHE_URL: redis://valkey:6379/1
    DD_SECRET_KEY: e2e-only-secret-key-not-for-production
    DD_CREDENTIAL_AES_256_KEY: e2e-only-aes-key-not-for-production
    DD_DATABASE_READINESS_TIMEOUT: "60"

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
  initializer:
    <<: *django
    depends_on: [postgres]
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *django-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_INITIALIZE: "true"
  uwsgi:
    <<: *django
    depends_on:
      initializer: { condition: service_completed_successfully }
      valkey: { condition: service_started }
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
  celeryworker:
    <<: *django
    depends_on:
      initializer: { condition: service_completed_successfully }
      valkey: { condition: service_started }
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
  nginx:
    image: "docker.io/defectdojo/defectdojo-nginx:${NGINX_VERSION:-3.4.202}"
    depends_on: [uwsgi]
    environment:
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    ports:
      - "127.0.0.1:${DD_PORT:-18080}:8080"
